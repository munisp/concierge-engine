[package]
name = "blob-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opendal = { version = "0.59", features = [
    "services-fs",
    "services-memory",
    "services-s3",
    "services-gcs",
    "services-azblob",
] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
