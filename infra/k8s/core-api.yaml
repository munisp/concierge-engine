apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: concierge-engine
  labels: { app: core-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: core-api }
  template:
    metadata:
      labels: { app: core-api }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "core-api"
        dapr.io/app-port: "8000"
    spec:
      containers:
        - name: core-api
          image: ghcr.io/munisp/concierge-engine/core-api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - name: CE_STORE
              value: "pg"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: concierge-secrets, key: database-url } }
            - name: CE_POLICY_ENGINE_URL
              value: "http://policy-engine:8200"
            - name: CE_LEDGER_ADAPTER_URL
              value: "http://ledger-adapter:8210"
            - name: CE_EMAIL_ADAPTER_URL
              value: "http://email-adapter:8120"
            - name: CE_BLOB_ADAPTER_URL
              value: "http://blob-adapter:8230"
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: concierge-engine
spec:
  selector: { app: core-api }
  ports: [{ port: 8000, targetPort: 8000 }]
