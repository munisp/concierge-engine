apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-engine
  namespace: concierge-engine
  labels: { app: policy-engine }
spec:
  replicas: 2
  selector:
    matchLabels: { app: policy-engine }
  template:
    metadata:
      labels: { app: policy-engine }
    spec:
      containers:
        - name: policy-engine
          image: ghcr.io/munisp/concierge-engine/policy-engine:latest
          ports: [{ containerPort: 8200 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: policy-engine
  namespace: concierge-engine
spec:
  selector: { app: policy-engine }
  ports: [{ port: 8200, targetPort: 8200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-adapter
  namespace: concierge-engine
  labels: { app: ledger-adapter }
spec:
  replicas: 1   # singleton: ordered posting stream; scale via TB cluster, not replicas
  selector:
    matchLabels: { app: ledger-adapter }
  template:
    metadata:
      labels: { app: ledger-adapter }
    spec:
      containers:
        - name: ledger-adapter
          image: ghcr.io/munisp/concierge-engine/ledger-adapter:latest
          ports: [{ containerPort: 8210 }]
          env:
            - name: TB_ADDRESSES
              value: "tigerbeetle:3000"
            - name: TB_CLUSTER
              value: "0"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-adapter
  namespace: concierge-engine
spec:
  selector: { app: ledger-adapter }
  ports: [{ port: 8210, targetPort: 8210 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-adapter
  namespace: concierge-engine
  labels: { app: mojaloop-adapter }
spec:
  replicas: 1   # saga state is in-memory in Phase 2; singleton keeps callback ordering simple
  selector:
    matchLabels: { app: mojaloop-adapter }
  template:
    metadata:
      labels: { app: mojaloop-adapter }
    spec:
      containers:
        - name: mojaloop-adapter
          image: ghcr.io/munisp/concierge-engine/mojaloop-adapter:latest
          ports: [{ containerPort: 8220 }]
          env:
            - name: MOJALOOP_TRANSFER_TTL_SECS
              value: "900"
            - name: CE_ML_SWEEP_SECS
              value: "5"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-adapter
  namespace: concierge-engine
spec:
  selector: { app: mojaloop-adapter }
  ports: [{ port: 8220, targetPort: 8220 }]
---
# Phase 49: blob-adapter — Apache OpenDAL object storage engine. Scheme and
# service config come from env (CE_BLOB_SCHEME + OPENDAL_* passthrough);
# fs default uses the mounted volume. Replicas: 1 with fs (local disk is
# not shared); scale freely with s3/gcs/azblob backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob-adapter
  namespace: concierge-engine
  labels: { app: blob-adapter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: blob-adapter }
  template:
    metadata:
      labels: { app: blob-adapter }
    spec:
      containers:
        - name: blob-adapter
          image: ghcr.io/munisp/concierge-engine/blob-adapter:latest
          ports: [{ containerPort: 8230 }]
          env:
            - name: CE_BLOB_SCHEME
              value: "fs"
            - name: OPENDAL_ROOT
              value: "/var/lib/ce-blobs"
          volumeMounts:
            - name: blobs
              mountPath: /var/lib/ce-blobs
          resources:
            requests: { cpu: 50m, memory: 64Mi }
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: blob-adapter-data
---
apiVersion: v1
kind: Service
metadata:
  name: blob-adapter
  namespace: concierge-engine
spec:
  selector: { app: blob-adapter }
  ports: [{ port: 8230, targetPort: 8230 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blob-adapter-data
  namespace: concierge-engine
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 20Gi }
