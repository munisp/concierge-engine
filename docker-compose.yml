version: "3.9"

# Local development infrastructure — mirrors the Phase-1 platform foundations
# (Master Spec §9/§15): Postgres (RLS), Redis, Kafka, Temporal, Keycloak,
# TigerBeetle, OpenSearch. APISIX/openappsec run at the edge in K8s (infra/).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: concierge
      POSTGRES_DB: concierge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concierge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: concierge-engine-dev-0000001

  temporal:
    image: temporalio/auto-setup:1.24
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: concierge
      POSTGRES_PWD: concierge
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:2.31
    ports: ["8233:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [temporal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/realm-concierge.json:/opt/keycloak/data/import/realm-concierge.json:ro

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.40
    command: start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    ports: ["3000:3000"]
    volumes: ["tbdata:/data"]

  opensearch:
    image: opensearchproject/opensearch:2.17
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Concierge#Dev1"
      DISABLE_SECURITY_PLUGIN: "true"
    ports: ["9200:9200"]

volumes:
  pgdata:
  tbdata:
