name: ci

on:
  push:
    branches: [main]
  pull_request:

# Phase 50: default-deny token permissions — jobs elevate nothing they do
# not need. Actions are pinned to full commit SHAs (tags are mutable; the
# 2025-26 supply-chain wave — Shai-Hulud, TanStack release-pipeline hijack,
# Megalodon — ran through exactly this surface).
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.23" }
      - run: cd services/core-api && go vet ./... && go test ./...
      # The pg build tag broke silently once — never again.
      - run: cd services/core-api && go build -tags pg ./...

  # Phase 12: pg-backed integration tests against a real Postgres+PostGIS.
  # Migrations run as the superuser; tests run as a non-superuser role so
  # FORCE RLS actually applies (superusers bypass RLS entirely).
  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concierge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.23" }
      - name: Apply migrations (superuser)
        run: |
          for f in db/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d concierge -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Create app role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d concierge -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app LOGIN PASSWORD 'app';
          GRANT USAGE ON SCHEMA public TO app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app;
          SQL
      - name: pg integration tests (RLS-active role)
        env:
          CE_PG_TEST_DSN: postgres://app:app@localhost:5432/concierge?sslmode=disable
        run: cd services/core-api && go test -tags pg ./internal/store/ -run TestPG -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-18)
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: cd crates && cargo fmt --check && cargo clippy --workspace -- -D warnings && cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r ai/concierge-agent/requirements.txt -r ai/whatsapp-adapter/requirements.txt -r ai/voice-adapter/requirements.txt -r ai/email-adapter/requirements.txt pytest
      # tesseract: local OCR engine for the media-intake tests (real extraction gate)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core
      - run: cd ai/concierge-agent && python -m pytest tests -q
      - run: cd ai/whatsapp-adapter && python -m pytest tests -q
      - run: cd ai/voice-adapter && python -m pytest tests -q
      - run: cd ai/email-adapter && python -m pytest tests -q
      - run: python -m pytest analytics/tests -q
      # Temporal worker: the time-skipping test server downloads on first use.
      - run: pip install -r workers/requirements.txt pytest-asyncio
      - run: cd workers && python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20" }
      # Phase 50: --ignore-scripts — the Shai-Hulud worm executed via
      # lifecycle scripts. The build needs none (esbuild ships binaries via
      # optionalDependencies), so scripts stay off.
      - run: cd web/console && npm ci --ignore-scripts && npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      # buf module root is contracts/proto (buf.yaml v2 lives there); running
      # from the repo root breaks imports. lint only — no BSR push.
      - uses: bufbuild/buf-action@5150a1eef5c10b6a5cf8a69fc872f24a09473195 # v1.1.1
        with:
          input: contracts/proto
          lint: true
          breaking: false

  # Phase 50: security gate — every push is scanned for leaked secrets,
  # known-vulnerable dependencies in all four stacks, and workflow
  # misconfiguration. Tools are pinned (version + sha256 where downloaded).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false } # full history for gitleaks

      - name: gitleaks (secret scan, pinned binary + checksum)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 1 .

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.23" }
      - name: govulncheck (Go vulnerability scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          cd services/core-api && govulncheck ./...

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-18)
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: cargo-audit (Rust advisory DB)
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cd crates && cargo audit

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: pip-audit (Python vulnerability scan)
        run: |
          pip install --upgrade "pip>=26.3" "pip-audit==2.10.1"
          for f in ai/concierge-agent/requirements.txt ai/whatsapp-adapter/requirements.txt ai/voice-adapter/requirements.txt ai/email-adapter/requirements.txt workers/requirements.txt; do
            pip-audit -r "$f" --progress-spinner off
          done
      - name: zizmor (GitHub Actions static analysis)
        run: pipx run zizmor==1.32.0 .github/workflows/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20" }
      # Production deps only: vite/esbuild/picomatch advisories are dev-time
      # build tooling (never shipped; the console is a static build artifact).
      - name: npm audit (console production deps)
        run: cd web/console && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
