[package]
name = "ledger-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
thiserror = "2"
