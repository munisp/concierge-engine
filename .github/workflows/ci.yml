name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: cd services/core-api && go vet ./... && go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cd crates && cargo fmt --check && cargo clippy --workspace -- -D warnings && cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ai/concierge-agent/requirements.txt -r ai/whatsapp-adapter/requirements.txt pytest
      # tesseract: local OCR engine for the media-intake tests (real extraction gate)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core
      - run: cd ai/concierge-agent && python -m pytest tests -q
      - run: cd ai/whatsapp-adapter && python -m pytest tests -q
      - run: python -m pytest analytics/tests -q
      # Temporal worker: the time-skipping test server downloads on first use.
      - run: pip install -r workers/requirements.txt pytest-asyncio
      - run: cd workers && python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd web/console && npm ci && npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # buf module root is contracts/proto (buf.yaml v2 lives there); running
      # from the repo root breaks imports. lint only — no BSR push.
      - uses: bufbuild/buf-action@v1
        with:
          input: contracts/proto
          lint: true
          breaking: false
