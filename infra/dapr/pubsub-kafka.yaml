apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: domain-events
  namespace: concierge-engine
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka:9092"
    - name: consumerGroup
      value: "concierge-engine"
    - name: authType
      value: "none"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: concierge-engine
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis:6379"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secrets
  namespace: concierge-engine
spec:
  type: secretstores.kubernetes
  version: v1
